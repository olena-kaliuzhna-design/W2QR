<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-section="tools" data-page="">

  <main class="page page--narrow">
    <div class="eyebrow">Tools</div>
    <h1 class="page-title">Cloud Backup</h1>
    <p class="page-sub">Backup and restore your encrypted wallet QR codes with Google Drive.</p>
    <div class="panel drive-panel">
      <span class="tile__icon" style="width:64px;height:64px;border-radius:20px"><i data-icon="cloud"></i></span>
      <p style="font-size:18px;margin:0;text-align:center">Sign in with your Google account to access your wallet backups.</p>
      <p class="helper" style="font-size:15px;max-width:440px;text-align:center;margin:0">W2QR only stores encrypted files in your Drive — your password and seed phrase never leave this device.</p>
      <button class="btn btn--white" type="button"><i data-icon="drive"></i>Connect Google Drive</button>
    </div>
    <a class="back-link" href="tools.html"><i data-icon="back"></i>Tools</a>
